services:
  mysql:
    image: mysql:8.4
    container_name: bersantai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bersantai
      MYSQL_USER: bersantai
      MYSQL_PASSWORD: bersantai_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - bersantai_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bersantai_mysql_data:
